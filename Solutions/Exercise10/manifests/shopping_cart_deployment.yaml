# shopping_cart_deployment.yaml
# NOTE: the brief sets namespace: devops-exercise here, but it is never created
# and its Service (and every verification step) lives in `default`. Left in
# that namespace the Deployment fails to apply and the Service selects nothing,
# so this solution uses `default` — see README "Deviations from the brief".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-cart
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shopping-cart
  template:
    metadata:
      labels:
        app: shopping-cart
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: shopping-cart
            topologyKey: "kubernetes.io/hostname"
      containers:
      - name: shopping-cart-container
        image: shopping-cart:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
